server {
  # Unprivileged port: the container runs as nginx, not root.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The browser talks to the API same-origin, so there is no CORS preflight and the session
  # cookie is a first-party cookie. Rewriting strips /api before it reaches Fastify.
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  # Hashed filenames, so the assets are immutable and index.html never is.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The Geist files have stable names, so they get a long but finite life rather than forever.
  location /fonts/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;   # client-side routing
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
}
